<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Local Stream Ghana | G-Eye TV</title>
    
    <link rel="icon" href="images/geyetv.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">

    <!-- CRITICAL: Add this script to play HLS streams -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
</head>
<body>

    <nav class="topnav">
        <a class="navbar-brand" href="#"><i class="fas fa-home me-2"></i>Home</a>
    </nav>

    <div class="container-fluid p-3">
        <div class="row justify-content-center g-4">

            <!-- PLAYER SECTION -->
            <div class="col-12 col-lg-8 mt-4">
                <div class="player-container">
                    <!-- Changed iframe to video tag -->
                    <video id="mainPlayer" controls autoplay playsinline class="player-iframe"></video>
                </div>

                <span id="statusLabel" class="now-playing">
                    <i class="fas fa-circle-play me-2"></i>Now Playing: G-Eye TV
                </span>
            </div>

            <!-- CHANNELS SECTION -->
            <div class="col-12 col-lg-4 mt-4">
                <div class="channel-list">
                    <h5 class="mb-3 text-uppercase fw-bold" style="color: #e50914;">G-Eye Channels</h5>
                    <ul id="vidlink">
                        <!-- Channels injected by app.js -->
                    </ul>
                </div>
            </div>

        </div>
    </div>

    <footer class="copyright-footer">
        &copy; 2026 LocalCode Technology. All Rights Reserved.
    </footer>

    <script src="app.js"></script>
</body>
</html>
