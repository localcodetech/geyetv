<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>G-Eye Web Portal </title>

    <link rel="icon" href="images/geyetv.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">

    <!-- CRITICAL: Add this script to play HLS streams -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js"></script>
</head>
<body>

    <nav class="topnav">
        <a class="navbar-brand" href="#">
            <img src="images/geyetv.png" alt="G-Eye TV" class="brand-logo">
            <span>G-Eye TV</span>
        </a>
        <span class="live-badge"><span class="live-dot"></span>LIVE</span>
    </nav>

    <div class="container-fluid p-3">
        <div class="row justify-content-center g-4">

            <!-- PLAYER SECTION -->
            <div class="col-12 col-lg-8 mt-4 player-col">
                <div class="player-container">
                    <!-- Changed iframe to video tag -->
                    <video id="mainPlayer" controls autoplay playsinline class="player-iframe"></video>

                    <!-- Loading / error / tap-to-play states -->
                    <div id="playerOverlay" class="player-overlay">
                        <div class="spinner-border text-light overlay-spinner" role="status"></div>
                        <i class="fas fa-triangle-exclamation overlay-error-icon"></i>
                        <i class="fas fa-circle-play overlay-play-icon"></i>
                        <p id="overlayMessage" class="overlay-message"></p>
                        <button id="retryBtn" type="button" class="btn btn-sm btn-danger overlay-retry">
                            <i class="fas fa-rotate-right me-1"></i>Retry
                        </button>
                    </div>
                </div>

                <span id="statusLabel" class="now-playing">
                    <i class="fas fa-circle-play me-2"></i><span id="statusText">Now Playing: G-Eye TV</span>
                </span>
            </div>

            <!-- CHANNELS SECTION -->
            <div class="col-12 col-lg-4 mt-4">
                <div class="channel-list">
                    <ul class="nav nav-pills channel-tabs mb-3">
                        <li class="nav-item">
                            <button type="button" class="nav-link active" data-tab="tv"><i class="fas fa-tv me-2"></i>TV</button>
                        </li>
                        <li class="nav-item">
                            <button type="button" class="nav-link" data-tab="radio"><i class="fas fa-radio me-2"></i>Radio</button>
                        </li>
                    </ul>

                    <div class="search-box mb-3">
                        <i class="fas fa-magnifying-glass"></i>
                        <input type="search" id="channelSearch" class="form-control" placeholder="Search channels..." autocomplete="off">
                    </div>

                    <ul id="vidlink">
                        <!-- Channels injected by app.js -->
                    </ul>
                    <p id="noResults" class="no-results" hidden>No channels found</p>
                </div>
            </div>

        </div>
    </div>

    <footer class="copyright-footer">
        &copy; <span id="year">2026</span> LocalCode Technology. All Rights Reserved.
    </footer>

    <script src="app.js"></script>
</body>
</html>
