# Netlify build settings. These override the values in the Netlify dashboard.
# Netlify detects Next.js and applies its OpenNext adapter automatically,
# which serves the pages, API routes and cached data from functions.

[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  # Next.js 16 needs Node 20.9+
  NODE_VERSION = "22"

# Make sure the Next.js runtime is used. Without it, .next is served as plain
# static files and every page returns 404.
[[plugins]]
  package = "@netlify/plugin-nextjs"
